# ============================================================================
# ReadSync · Nginx 反向代理（非标准 HTTPS 端口，适用于大陆未备案域名）
#
# 为什么用 8443 而不是 443：
#   大陆服务器上 80/443 要求域名已完成 ICP 备案，未备案会被运营商拦截；
#   其他端口不受此限制。证书本身用 DNS 验证申请即可，不需要开放 80/443。
#
# 用法：
#   sudo cp deploy/https/nginx-nonstandard-port.conf /etc/nginx/conf.d/readsync.conf
#   sudo sed -i 's/read.example.com/你的域名/g' /etc/nginx/conf.d/readsync.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 同时记得在云控制台安全组放行 8443 端口。
# ============================================================================

# ---------------------------------------------------------------------------
# 可选的 HTTP 跳转。
# 注意：未备案时 80 端口会被运营商拦截，这段通常用不上；
# 若你的域名已备案，可把 listen 改成 80 并启用。
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name read.example.com;
#     return 301 https://$host:8443$request_uri;
# }

server {
    listen 8443 ssl;
    http2 on;
    server_name read.example.com;

    # 证书路径。ssl_certificate 必须指向**含中间证书的完整链**
    # （云厂商下载包里的 .pem 通常已是 fullchain），否则浏览器会报
    # 「您的连接不是私密连接」。
    ssl_certificate     /etc/nginx/ssl/read.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/read.example.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 书籍文件可能上百 MB，按需调整
    client_max_body_size 2g;

    # 安全响应头由服务端的 helmet 统一设置（含 CSP 与 HSTS），
    # 这里不重复添加，避免两处配置不一致。

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        # Host 带上端口，与实际访问地址保持一致
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;

        # 大文件上传/下载时不要缓冲到磁盘或内存，直接透传
        proxy_request_buffering off;
        proxy_buffering         off;

        # 上传大文件与远程存储（WebDAV/S3）中转可能较慢
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
