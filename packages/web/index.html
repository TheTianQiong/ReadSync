<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="读记服务器 ReadSync —— 自托管的阅读进度同步服务器" />
    <title>读记服务器 ReadSync</title>
    <!--
      主题初始化必须放在同源外部脚本里（见 public/theme-init.js），
      不能写成内联 <script>：生产环境 CSP 为 script-src 'self'，
      内联脚本会被浏览器直接拦截，导致深色模式首帧闪白。
      放在样式表之前，是为了尽早给 <html> 打上 .dark。
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
