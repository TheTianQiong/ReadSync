<!--
  站点图标：一本摊开的书，用墨水墨色（纸白底 + 墨黑线条）。
  用 SVG 而不是 .ico，体积小且在任何 DPI 下都清晰；
  在 index.html 里通过 <link rel="icon"> 引用后，浏览器就不会再去请求
  /favicon.ico（那个请求原先会落到 SPA 兜底逻辑上，返回一份 HTML）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#f7f7f5" />
  <g fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 9.5c-2.2-1.7-4.6-2.3-7-2.3v13.6c2.4 0 4.8.6 7 2.3 2.2-1.7 4.6-2.3 7-2.3V7.2c-2.4 0-4.8.6-7 2.3z" />
    <path d="M16 9.5v13.6" />
  </g>
</svg>
